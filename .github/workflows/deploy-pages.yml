name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /PAMoR

      - name: Prepare Pages output
        run: |
          # assetPrefix 让 vinext 把资源写进 dist/client/PAMoR/_next，
          # 但 HTML 引用的是 /PAMoR/_next —— 而 /PAMoR/ 正是 Pages 的站点根，
          # 所以要把这层重复目录合并掉。
          mv dist/client/PAMoR/_next dist/client/_next
          rmdir dist/client/PAMoR
          touch dist/client/.nojekyll
          # 校验：index.html 存在，且它引用的每个本地资源都真的落了盘
          test -f dist/client/index.html
          grep -oiE '(src|srcset|href|poster)="/PAMoR/[^"]*"' dist/client/index.html \
            | sed -E 's|.*="/PAMoR/([^"]*)"|\1|' | sort -u \
            | while read -r f; do
                test -e "dist/client/$f" || { echo "MISSING: $f"; exit 1; }
              done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
